syntax = "proto3";

package us3_turbo.proxy;

option cc_generic_services = true;

// Mode B：所有控制面经 proxy。client 只与 proxy 交互；统一 PutObject 接口按
// PutDataPath 选择通路（PATH_GDS / PATH_UCX；PATH_ALL 推迟到后续版本）。
// 两条链路各对应一个独立 RPC（GdsPut / UcxPut），保持代码与测试隔离：
//
//   client → PutObject(req{path,...}, buffer, resp)
//          ├─ PATH_GDS → AcquireToken(device) → GdsPut → resp.gds_result
//          └─ PATH_UCX → AcquireDescriptor(host) → UcxPut → resp.ucx_result
//   proxy : GdsPut/UcxPut 校验后同步转发 backend，回 PutPathResult
//   backend: GdsPut → cuObj RDMA-READ token；UcxPut → ucp_get_nbx 反向拉
//
// gds 与 ucx 两条链路第一版不做任何共同逻辑抽象，各自独立实现。
// request_id 保留作跨端日志关联。wire 内部协同重编，无外部兼容承诺。

// PUT 通路选择。bitflags 语义但 v1 仅支持单路（PATH_GDS / PATH_UCX）；
// PATH_NONE=0 作无效默认（client 校验拒绝）；PATH_ALL 推迟（单 buffer 无法
// 同时喂 device 显存 + host 内存）。
enum PutDataPath {
  PATH_NONE = 0;
  PATH_GDS  = 1;
  PATH_UCX  = 2;
  PATH_ALL  = 3;
}

// GDS 通路数据源：cuObj RDMA token（client 显存地址 + remote key 的自描述串）。
message GdsDataSource {
  string rdma_token = 1;
}

// UCX 通路数据源：host buffer 虚拟地址 + packed rkey + client UCX listener 地址。
// UCX RMA 连接式，backend 须据 client_ucx_addr 主动 dial 建 ep 后 ucp_get_nbx。
// packed_rkey 为 ucp_rkey_pack 导出的裸字节，故用 bytes（非 UTF-8 安全）。
message UcxDataSource {
  uint64 remote_addr     = 1;
  bytes  packed_rkey     = 2;
  string client_ucx_addr = 3;
}

// client → proxy 统一 PUT 请求。path 必填；对应通路的 source 按需填充
//（PATH_GDS→gds_source，PATH_UCX→ucx_source）。optional 未设则不序列化。
message ClientProxyPutRequest {
  string                     request_id  = 1;
  string                     bucket      = 2;
  string                     key         = 3;
  uint64                     object_size = 4;
  PutDataPath                path        = 5;
  optional GdsDataSource     gds_source  = 10;
  optional UcxDataSource     ucx_source  = 11;
}

// 单条通路的执行结果。ok=false 时 error_code/error_message 描述失败原因。
message PutPathResult {
  bool   ok            = 1;
  int32  error_code    = 2;
  string error_message = 3;
  string etag          = 4;
  uint32 crc32c        = 5;
  uint64 bytes_written = 6;
}

// proxy → client 统一 PUT 响应。各通路结果按 path 独立返回（optional）。
// object_id 由 proxy/backend 生成（bucket/key 派生），供后续对象寻址。
message ClientProxyPutResponse {
  string                       object_id  = 1;
  optional PutPathResult       gds_result = 10;
  optional PutPathResult       ucx_result = 11;
}

// ========== 分段上传控制面消息 ==========
// 设计：client 只与 proxy 的 Control 服务交互（CreateMultipartUpload /
// UploadPart{Gds,Ucx} / CompleteMultipartUpload）；proxy 内存态会话 + 按 4MB
// 切分后经 BackendDataPlane.PutBlock 调 backend。单步 GdsPut/UcxPut 保留不变，
// 分段路径与之完全隔离。part_number 从 1 开始、客户端分配；block_no 从 0
// 开始、proxy 分配。request_id 贯穿三层做日志关联。

// 初始化分段上传。path 锁定整条会话的通路（PATH_GDS / PATH_UCX），后续
// UploadPart 必须与会话 path 匹配，否则 proxy 拒绝。
message CreateMultipartUploadRequest {
  string      request_id = 1;
  string      bucket     = 2;
  string      key        = 3;
  PutDataPath path       = 4;
}

message CreateMultipartUploadResponse {
  bool   ok            = 1;
  string upload_id     = 2;  // UUID，proxy 生成
  string error_message = 3;
}

// 上传单个 part — GDS 路径。rdma_token 为本 part 独立注册的 cuObj RDMA
// token（"hexaddr:rkey"），proxy 切分后把 source_offset 透传给 backend。
message UploadPartGdsRequest {
  string request_id  = 1;
  string upload_id   = 2;
  uint32 part_number = 3;  // 从 1 开始，客户端分配
  uint64 part_size   = 4;  // 本 part 总大小
  string rdma_token  = 5;
}

// 上传单个 part — UCX 路径。remote_addr 为本 part host buffer 起始虚拟地址，
// proxy 切分后按 remote_addr + source_offset 传给 backend（地址加偏移）。
message UploadPartUcxRequest {
  string request_id      = 1;
  string upload_id       = 2;
  uint32 part_number     = 3;
  uint64 part_size       = 4;
  uint64 remote_addr     = 5;
  bytes  packed_rkey     = 6;
  string client_ucx_addr = 7;
}

// UploadPart 响应（GDS/UCX 共用）。etag 为本 part 的 ETag（proxy 汇总 block
// etag 得到）；crc32c 仅在 backend 启用 CRC 计算时返回。
message UploadPartResponse {
  bool             ok            = 1;
  string           etag          = 2;
  optional uint32  crc32c        = 3;
  uint64           bytes_written = 4;
  string           error_message = 5;
}

// 完成分段上传。parts 可选（客户端用以校验已传 part 的 etag）。
message CompleteMultipartUploadRequest {
  string request_id = 1;
  string upload_id  = 2;
  repeated PartInfo parts = 3;

  message PartInfo {
    uint32 part_number = 1;
    string etag        = 2;
  }
}

message CompleteMultipartUploadResponse {
  bool   ok            = 1;
  string object_id     = 2;  // bucket/key 派生
  string etag          = 3;  // 最终对象 ETag
  uint64 object_size   = 4;
  string error_message = 5;
}

// ========== Proxy → Backend 数据面消息（block 级，带 offset）==========
// GDS block 数据源：source_offset 为相对 token 注册 region 的偏移，backend
// 据此从 client 显存子区间反向 RDMA-READ（cuObjServer handlePutObject 的
// local_offset 形参，替代单步路径硬编码的 0）。
message GdsBlockSource {
  string rdma_token    = 1;
  uint64 source_offset = 2;
  uint64 block_size    = 3;
}

// UCX block 数据源：remote_addr 已由 proxy 加上 source_offset，backend 直接
// ucp_get_nbx(ep, buf, block_size, remote_addr, rkey)。
message UcxBlockSource {
  uint64 remote_addr     = 1;
  bytes  packed_rkey     = 2;
  string client_ucx_addr = 3;
  uint64 block_size      = 4;
}

// proxy 向 backend 发送的 block 级请求。oneof source 区分 GDS/UCX。
message ProxyBackendPutBlockRequest {
  string      request_id  = 1;
  string      upload_id   = 2;
  uint32      part_number = 3;
  uint32      block_no    = 4;  // part 内 block 序号（从 0 开始）
  oneof source {
    GdsBlockSource gds_source  = 10;
    UcxBlockSource ucx_source  = 11;
  }
}

message ProxyBackendPutBlockResponse {
  bool             ok            = 1;
  string           etag          = 2;  // 本 block 的 ETag
  optional uint32  crc32c        = 3;  // backend 启用 CRC 时返回
  string           error_message = 4;
}

// 单一 service，proxy 与 backend 都实现（brpc 按 service descriptor full_name
// 去重，一进程一实例）。GdsPut / UcxPut 两个独立 RPC，内部代码独立、无共享逻辑。
service Control {
  rpc GdsPut(ClientProxyPutRequest) returns (PutPathResult);
  rpc UcxPut(ClientProxyPutRequest) returns (PutPathResult);

  // ===== 分段上传接口（client → proxy） =====
  rpc CreateMultipartUpload(CreateMultipartUploadRequest)
      returns (CreateMultipartUploadResponse);
  rpc UploadPartGds(UploadPartGdsRequest) returns (UploadPartResponse);
  rpc UploadPartUcx(UploadPartUcxRequest) returns (UploadPartResponse);
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest)
      returns (CompleteMultipartUploadResponse);
}

// Backend 数据面 block 级服务（proxy → backend）。与 Control 同进程注册：
// brpc 按 service full_name 去重，Control 与 BackendDataPlane 是两个不同
// descriptor，可共注册于同一 brpc server。backend 用独立的 C++ 类实现
// （不能与 Control 共类继承——Service 多继承会产生 CallMethod 歧义）。
service BackendDataPlane {
  rpc PutBlock(ProxyBackendPutBlockRequest) returns (ProxyBackendPutBlockResponse);
}
